global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "fastapi-model-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["fastapi-serving:8000"]
        labels:
          app: "credit-card-default-api"
          env: "production"

  - job_name: "tensorflow-serving"
    metrics_path: "/monitoring/prometheus/metrics"
    static_configs:
      - targets: ["tf-serving:8501"]
        labels:
          app: "credit-card-default-catboost"
          model: "CreditCardDefaultCatBoost"
          model_version: "1"
          env: "production"
