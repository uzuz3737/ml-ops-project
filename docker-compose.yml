x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqnvq8=
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - MLFLOW_TRACKING_URI=http://mlflow:5000
    - PYTHONPATH=/opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./models:/opt/airflow/models
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_started

services:
  # ----------------------------------------------------
  # MLflow Tracking & Model Registry Server
  # ----------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: mlflow-server
    entrypoint: ["/bin/sh", "-c"]
    ports:
      - "8000:5000"
    command: |
      if [ ! -f /mlflow/mlflow.db ]; then
        cp /mlflow-seed/mlflow.db /mlflow/mlflow.db
        cp -a /mlflow-seed/artifacts/. /mlartifacts/
      fi
      exec mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --serve-artifacts --artifacts-destination /mlartifacts --host 0.0.0.0 --port 5000
    volumes:
      - ./mlruns:/mlflow
      - ./mlartifacts:/mlartifacts
      - ./mlflow/bootstrap:/mlflow-seed:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Airflow Metadata DB
  # ----------------------------------------------------
  postgres:
    image: postgres:15.12-alpine3.21
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Airflow Database Initialization
  # ----------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: version
    environment:
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------
  # Airflow Webserver
  # ----------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------
  # Airflow Scheduler
  # ----------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------
  # Model Serving: FastAPI with Prometheus Metrics
  # ----------------------------------------------------
  fastapi-serving:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    container_name: fastapi-serving
    ports:
      - "8001:8000"
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - SERVING_MODEL_FAMILY=${SERVING_MODEL_FAMILY:-catboost}
    depends_on:
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # TensorFlow Serving adapter for the registered CatBoost model
  # ----------------------------------------------------
  tf-model-exporter:
    build:
      context: .
      dockerfile: docker/Dockerfile.tf_exporter
    container_name: tf-model-exporter
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - SERVING_MODEL_FAMILY=${SERVING_MODEL_FAMILY:-catboost}
      - TF_SERVING_MODEL_NAME=CreditCardDefaultCatBoost
      - TF_SERVING_MODEL_ROOT=/models
    volumes:
      - ./models/tf_serving:/models
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on:
      mlflow:
        condition: service_healthy

  tf-serving:
    image: tensorflow/serving:2.15.1
    container_name: tensorflow-serving
    command:
      - --port=8500
      - --rest_api_port=8501
      - --model_name=CreditCardDefaultCatBoost
      - --model_base_path=/models/CreditCardDefaultCatBoost
      - --monitoring_config_file=/etc/tf-serving/monitoring_config.pbtxt
    ports:
      - "8501:8501"
      - "8502:8501"
    volumes:
      - ./models/tf_serving:/models:ro
      - ./monitoring/tf_serving/monitoring_config.pbtxt:/etc/tf-serving/monitoring_config.pbtxt:ro
    depends_on:
      tf-model-exporter:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8501'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ----------------------------------------------------
  # Monitoring: Prometheus
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      fastapi-serving:
        condition: service_started
      tf-serving:
        condition: service_healthy

  # ----------------------------------------------------
  # Monitoring: Grafana Dashboard
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
