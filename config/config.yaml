project:
  name: "credit-card-default-mlops"
  version: "1.0.0"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  validation_dir: "data/validation"
  raw_data_file: "data/raw/credit_card_clients.csv"
  train_data_file: "data/processed/train.parquet"
  test_data_file: "data/processed/test.parquet"
  val_data_file: "data/processed/val.parquet"
  stats_dir: "data/validation/stats"
  schema_dir: "data/validation/schema"
  anomalies_file: "data/validation/anomalies.txt"
  target_col: "default_payment_next_month"
  id_col: "ID"
  test_size: 0.2
  val_size: 0.1
  random_state: 42

features:
  categorical_cols:
    - "SEX"
    - "EDUCATION"
    - "MARRIAGE"
  numerical_cols:
    - "LIMIT_BAL"
    - "AGE"
    - "PAY_0"
    - "PAY_2"
    - "PAY_3"
    - "PAY_4"
    - "PAY_5"
    - "PAY_6"
    - "BILL_AMT1"
    - "BILL_AMT2"
    - "BILL_AMT3"
    - "BILL_AMT4"
    - "BILL_AMT5"
    - "BILL_AMT6"
    - "PAY_AMT1"
    - "PAY_AMT2"
    - "PAY_AMT3"
    - "PAY_AMT4"
    - "PAY_AMT5"
    - "PAY_AMT6"

model:
  name: "logreg_credit_default"
  algorithm: "LogisticRegression"
  params:
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000
    class_weight: "balanced"  # handle class imbalance (~22% default rate)
    random_state: 42

mlflow:
  tracking_uri: "http://localhost:5001"
  experiment_name: "credit_card_default_logreg"
  registered_model_name: "CreditCardDefaultLogReg"

serving:
  host: "0.0.0.0"
  port: 8000
  model_source: "models:/CreditCardDefaultLogReg/Production"
  fallback_model_path: "models/saved/logreg_model.joblib"
