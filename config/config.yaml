project:
  name: "credit-card-default-mlops"
  version: "1.0.0"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  validation_dir: "data/validation"
  raw_data_file: "data/raw/credit_card_clients.csv"
  train_data_file: "data/processed/train.parquet"
  test_data_file: "data/processed/test.parquet"
  val_data_file: "data/processed/val.parquet"
  stats_dir: "data/validation/stats"
  schema_dir: "data/validation/schema"
  anomalies_file: "data/validation/anomalies.txt"
  target_col: "default_payment_next_month"
  id_col: "ID"
  test_size: 0.2
  val_size: 0.1
  random_state: 42

features:
  categorical_cols:
    - "SEX"
    - "EDUCATION"
    - "MARRIAGE"
  numerical_cols:
    - "LIMIT_BAL"
    - "AGE"
    - "PAY_0"
    - "PAY_2"
    - "PAY_3"
    - "PAY_4"
    - "PAY_5"
    - "PAY_6"
    - "BILL_AMT1"
    - "BILL_AMT2"
    - "BILL_AMT3"
    - "BILL_AMT4"
    - "BILL_AMT5"
    - "BILL_AMT6"
    - "PAY_AMT1"
    - "PAY_AMT2"
    - "PAY_AMT3"
    - "PAY_AMT4"
    - "PAY_AMT5"
    - "PAY_AMT6"

model:
  name: "random_forest_credit_default"
  algorithm: "RandomForestClassifier"
  params:
    n_estimators: 400
    max_depth: 14
    min_samples_split: 10
    min_samples_leaf: 5
    max_features: "sqrt"
    class_weight: "balanced_subsample"
    random_state: 42
    n_jobs: -1
  tuning:
    enabled: true
    n_iter: 10
    cv: 3
    scoring: "roc_auc"
    param_distributions:
      n_estimators: [250, 400, 600]
      max_depth: [6, 10, 14, 18]
      min_samples_split: [5, 10, 20]
      min_samples_leaf: [2, 5, 10]
      max_features: ["sqrt", 0.5]
      class_weight: [null, "balanced_subsample"]

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "credit_card_default_random_forest"
  registered_model_name: "CreditCardDefaultRandomForest"

serving:
  host: "0.0.0.0"
  port: 8000
  model_source: "models:/CreditCardDefaultRandomForest/Production"
  fallback_model_path: "models/saved/random_forest_model.joblib"
