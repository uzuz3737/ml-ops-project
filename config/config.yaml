project:
  name: "credit-card-default-mlops"
  version: "1.0.0"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  validation_dir: "data/validation"
  raw_data_file: "data/raw/credit_card_clients.csv"
  train_data_file: "data/processed/train.parquet"
  test_data_file: "data/processed/test.parquet"
  val_data_file: "data/processed/val.parquet"
  stats_dir: "data/validation/stats"
  schema_dir: "data/validation/schema"
  anomalies_file: "data/validation/anomalies.txt"
  target_col: "default_payment_next_month"
  id_col: "ID"
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  allowed_values:
    SEX: [1, 2]
    EDUCATION: [0, 1, 2, 3, 4, 5, 6]
    MARRIAGE: [0, 1, 2, 3]
  valid_ranges:
    LIMIT_BAL: [0, 1000000]
    AGE: [18, 120]
    PAY_0: [-2, 9]
    PAY_2: [-2, 9]
    PAY_3: [-2, 9]
    PAY_4: [-2, 9]
    PAY_5: [-2, 9]
    PAY_6: [-2, 9]
    BILL_AMT1: [-10000000, 10000000]
    BILL_AMT2: [-10000000, 10000000]
    BILL_AMT3: [-10000000, 10000000]
    BILL_AMT4: [-10000000, 10000000]
    BILL_AMT5: [-10000000, 10000000]
    BILL_AMT6: [-10000000, 10000000]
    PAY_AMT1: [0, 1000000]
    PAY_AMT2: [0, 1000000]
    PAY_AMT3: [0, 1000000]
    PAY_AMT4: [0, 1000000]
    PAY_AMT5: [0, 1000000]
    PAY_AMT6: [0, 1000000]

features:
  categorical_cols:
    - "SEX"
    - "EDUCATION"
    - "MARRIAGE"
  numerical_cols:
    - "LIMIT_BAL"
    - "AGE"
    - "PAY_0"
    - "PAY_2"
    - "PAY_3"
    - "PAY_4"
    - "PAY_5"
    - "PAY_6"
    - "BILL_AMT1"
    - "BILL_AMT2"
    - "BILL_AMT3"
    - "BILL_AMT4"
    - "BILL_AMT5"
    - "BILL_AMT6"
    - "PAY_AMT1"
    - "PAY_AMT2"
    - "PAY_AMT3"
    - "PAY_AMT4"
    - "PAY_AMT5"
    - "PAY_AMT6"

model:
  name: "xgboost_credit_default"
  algorithm: "XGBClassifier"
  params:
    objective: "binary:logistic"
    eval_metric: "auc"
    n_estimators: 150
    max_depth: 5
    learning_rate: 0.08
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 3.5  # handle class imbalance (~22% default rate)
    random_state: 42
    n_jobs: -1

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "credit_card_default_xgboost"
  registered_model_name: "CreditCardDefaultXGBoost"

serving:
  model_family: "xgboost"
  host: "0.0.0.0"
  port: 8000
  model_source: "models:/CreditCardDefaultXGBoost/Production"
  fallback_model_path: "models/saved/xgb_model.joblib"
  prediction_log_file: "data/monitoring/predictions.jsonl"
  feedback_log_file: "data/monitoring/feedback.jsonl"

monitoring:
  experiment_name: "credit_card_default_production_monitoring"
  window_days: 7
  quality_window_days: 180
  data_drift_psi_threshold: 0.2
  min_labeled_feedback: 20
  min_roc_auc: 0.70

catboost_model:
  name: "catboost_credit_default"
  algorithm: "CatBoostClassifier"
  params:
    iterations: 500
    depth: 6
    learning_rate: 0.05
    loss_function: "Logloss"
    eval_metric: "AUC"
    auto_class_weights: "Balanced"
    random_seed: 42
    verbose: false
    allow_writing_files: false

catboost_mlflow:
  experiment_name: "credit_card_default_catboost"
  registered_model_name: "CreditCardDefaultCatBoost"
  artifact_path: "catboost_model"
  min_roc_auc: 0.70
